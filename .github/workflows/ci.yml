name: build-and-verify

# Four jobs, each answering one question:
#   build-and-test   does it compile warning-clean on GCC and Clang, with and
#                    without SuiteSparse, do the tests pass, and does the
#                    incremental-forming smoke deck run through sparlab_form?
#   verify           do the verification and validation studies still meet their
#                    documented tolerances?
#   benchmark        does a full topology-optimisation benchmark still run end to
#                    end and produce its figures - with the buckling constraint,
#                    the robust formulation and the overhang filter too - and do
#                    displacements, buckling load factors and large-deflection
#                    states still agree with scikit-fem?
#   python           does the precomp package (springback pre-compensation)
#                    install, and do its tests pass - the integration tests
#                    against a sparlab_form built in the job included?
#
# The verify job is the one that can catch a numerical regression, so it uploads
# its summary either way.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
        # ON requires SuiteSparse (CHOLMOD / UMFPACK) and fails the configure
        # without it; OFF builds the forming analysis on Eigen's
        # factorisations alone, and does not install SuiteSparse, so a
        # dependency on it that slipped past the CMake option is caught.
        cholmod: ["ON"]
        include:
          - compiler: gcc
            build_type: Release
            cholmod: "OFF"
    name: build and test (${{ matrix.compiler }}, ${{ matrix.build_type }}, SuiteSparse ${{ matrix.cholmod }})
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libeigen3-dev catch2
          if [ "${{ matrix.cholmod }}" = "ON" ]; then
            sudo apt-get install -y libsuitesparse-dev
          fi

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"   >> "$GITHUB_ENV"
            echo "CXX=g++"  >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSPARLAB_WITH_CHOLMOD=${{ matrix.cholmod }} \
            -DSPARLAB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        # The Debug build runs Eigen's own assertions, which is slow but is the
        # configuration most likely to catch an indexing mistake.
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

      - name: Forming smoke deck (sparlab_form)
        # The single-point incremental-forming smoke case of docs/forming.md
        # (40 x 40 x 1 mm sheet, 20 x 20 x 2 Hex8, two contours to 2 mm, then
        # the release): one to a few minutes, depending on the runner. Release
        # builds only - the Debug build's Eigen assertions make it slow, and
        # its tests already exercise the same code. sparlab_form exits
        # non-zero if a step stops; the summary must also say so, and the
        # factorisations must be the ones the build asked for.
        if: matrix.build_type == 'Release'
        run: |
          ./build/bin/sparlab_form --version
          ./build/bin/sparlab_form --config configs/forming/spif_smoke.json \
                                   --output results/spif_smoke --no-vtk \
                                   --strict-config --threads 2
          python3 - "${{ matrix.cholmod }}" <<'EOF'
          import json, sys
          s = json.load(open("results/spif_smoke/summary.json"))
          assert s["completed"], s["termination"]
          assert all(step["completed"] for step in s["steps"]), s["steps"]
          want = sys.argv[1] == "ON"
          assert bool(s["timing"]["suitesparse"]) == want, s["timing"]["suitesparse"]
          print("smoke deck:", s["timing"]["increments"], "increments,",
                s["timing"]["iterations"], "iterations,", round(s["runtime_s"], 1), "s;",
                "SuiteSparse" if want else "Eigen")
          EOF

  verify:
    name: verification and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libeigen3-dev catch2 libsuitesparse-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"

      - name: Run the studies
        # sparlab_verify exits non-zero if any study misses its documented
        # tolerance, so this step is the numerical regression gate.
        run: ./scripts/run_verification.sh results/verification

      - name: Upload the verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-summary
          path: results/verification/

  benchmark:
    name: benchmark smoke test and figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libeigen3-dev catch2 libsuitesparse-dev
          python3 -m pip install --quiet numpy pandas matplotlib pillow scikit-fem

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"

      - name: Static, modal and buckling analysis (Q4, Hex8, Tri3, Tet4, Tet10, Gmsh meshes)
        run: |
          # The verification decks, the curved-Tet10 engine mount and the
          # three columns whose decks also run the linear buckling check.
          for case in cantilever_analysis block_3d_analysis cantilever_tri_analysis \
                      block_tet_analysis lug_bracket_nu0_analysis \
                      engine_mount_tet10_analysis column_hex_buckling_analysis \
                      column_tet4_buckling_analysis column_tet10_buckling_analysis; do
            ./build/bin/sparlab_solve --config configs/verification/$case.json \
                                      --output results/$case --export-calculix
          done
          # The two parts read from Gmsh / Abaqus-format meshes, as static
          # analyses (their topology blocks are ignored by sparlab_solve).
          for case in lug_bracket_2d engine_mount_3d; do
            ./build/bin/sparlab_solve --config configs/benchmarks/$case.json \
                                      --output results/${case}_analysis --export-calculix
          done

      - name: Volume, pressure and thermal loads (Hex8, Tet10, Q4, curved Tet10)
        run: |
          # Self-weight, pressure, rotation and body force on a block; a
          # two-material plate under conducted, uniform and regional
          # temperatures; the curved engine mount under all of them.
          for case in block_loads_hex_analysis block_loads_tet10_analysis \
                      plate_thermal_hex_analysis plate_thermal_tet10_analysis \
                      plate_thermal_q4_analysis engine_mount_tet10_loads_analysis; do
            ./build/bin/sparlab_solve --config configs/verification/$case.json \
                                      --output results/$case --export-calculix
          done

      - name: Large-deflection analysis (Tet10, Hex8, Q4, neo-Hookean Tet10)
        run: |
          # The elastica at k = 10, a soft block under a follower pressure
          # and a rotation, a plane-strain strip under a dead load and a
          # follower pressure, and a neo-Hookean block with a driven tip.
          for case in elastica_tet10_nonlinear block_hex_nonlinear \
                      strip_q4_nonlinear block_tet10_neohookean_nonlinear; do
            ./build/bin/sparlab_solve --config configs/verification/$case.json \
                                      --output results/$case --export-calculix
          done

      - name: Elastoplastic analysis (Hex8, Q4, Tet10; small strain and finite)
        run: |
          # A cantilever loaded past yield and unloaded (C3D8), a plane-strain
          # strip (CPE4), a punch indentation (C3D10), a cycled cantilever
          # with combined hardening and B-bar, a cycled plane-stress strip, a
          # plate heated past yield and cooled, a large-deflection cantilever
          # with plasticity, and a clamped beam driven into membrane action
          # and back (finite kinematics, combined hardening) on Hex8 with
          # E-bar and on Q4 in plane strain (E-bar) and plane stress.
          for case in plastic_beam_hex_small_strain plastic_strip_q4_small_strain \
                      plastic_punch_tet10_small_strain plastic_beam_hex_cyclic \
                      plastic_strip_q4_plane_stress_cyclic plastic_plate_thermal_tet10 \
                      plastic_beam_tet10_nlgeom plastic_clamped_beam_hex_nlgeom \
                      plastic_clamped_strip_q4_nlgeom \
                      plastic_clamped_strip_q4_plane_stress_nlgeom; do
            ./build/bin/sparlab_solve --config configs/verification/$case.json \
                                      --output results/$case --export-calculix
          done

      - name: Transient dynamics and harmonic response (Hex8, Tet10, Q4)
        run: |
          # Linear transients (HHT-alpha with Rayleigh damping on Hex8, the
          # trapezoidal rule on Tet10, a plane-strain strip shaken at its root
          # with lumped mass), harmonic responses (a Q4 plate through four
          # resonances, a Hex8 block on a shaken base), and an elastoplastic
          # and a large-deflection transient on Hex8.
          for case in transient_cantilever_hex transient_column_tet10 \
                      transient_strip_q4_base frequency_response_plate_q4 \
                      frequency_response_block_hex transient_plastic_beam_hex \
                      transient_beam_hex_nlgeom; do
            ./build/bin/sparlab_solve --config configs/verification/$case.json \
                                      --output results/$case --export-calculix
          done

      - name: Cross-validation against scikit-fem
        # CalculiX is not installed on the runner, so only the scikit-fem
        # comparisons run: with SparLab's load vector, and - for the decks of
        # the volume, pressure and thermal loads - with the loads integrated
        # by scikit-fem from the exported CalculiX decks; for the non-linear
        # decks with dead loads, an independent total Lagrangian solve; for
        # the elastoplastic decks, an independent J2 solve (small strain or
        # finite kinematics); for the dynamics decks, an independent HHT-alpha
        # integration (linear, elastoplastic, large deflection) and a direct
        # complex harmonic solve. It
        # exits non-zero if a displacement field, a buckling load factor of
        # the three columns, a large-deflection or an elastoplastic state, a
        # transient history or a harmonic response differs beyond the
        # documented tolerance, or if a non-linear run stopped short of its
        # full load.
        run: |
          CASES=()
          for case in cantilever_analysis block_3d_analysis cantilever_tri_analysis \
                      block_tet_analysis lug_bracket_nu0_analysis \
                      lug_bracket_2d_analysis engine_mount_3d_analysis \
                      engine_mount_tet10_analysis column_hex_buckling_analysis \
                      column_tet4_buckling_analysis column_tet10_buckling_analysis \
                      block_loads_hex_analysis block_loads_tet10_analysis \
                      plate_thermal_hex_analysis plate_thermal_tet10_analysis \
                      plate_thermal_q4_analysis engine_mount_tet10_loads_analysis \
                      elastica_tet10_nonlinear block_hex_nonlinear \
                      strip_q4_nonlinear block_tet10_neohookean_nonlinear \
                      plastic_beam_hex_small_strain plastic_strip_q4_small_strain \
                      plastic_punch_tet10_small_strain plastic_beam_hex_cyclic \
                      plastic_strip_q4_plane_stress_cyclic plastic_plate_thermal_tet10 \
                      plastic_beam_tet10_nlgeom plastic_clamped_beam_hex_nlgeom \
                      plastic_clamped_strip_q4_nlgeom \
                      plastic_clamped_strip_q4_plane_stress_nlgeom \
                      transient_cantilever_hex transient_column_tet10 \
                      transient_strip_q4_base frequency_response_plate_q4 \
                      frequency_response_block_hex transient_plastic_beam_hex \
                      transient_beam_hex_nlgeom; do
            CASES+=(--case results/$case)
          done
          python3 python/scripts/cross_validate.py --skip-calculix "${CASES[@]}" \
              --output results/cross_validation

      - name: Topology optimization on reduced meshes
        # The committed decks run for several hundred iterations on fine
        # meshes. CI runs the same decks at a fraction of the resolution and a
        # shorter budget: enough to exercise the whole pipeline - OC and MMA,
        # the stress constraint, the Hex8 path, the modal comparison of the
        # interpreted topology and the geometry export - in a few minutes.
        run: |
          ./build/bin/sparlab_topopt \
            --config configs/benchmarks/cantilever_beam.json \
            --output results/cantilever_beam \
            --nx 80 --ny 40 --max-iterations 60 --modes 4
          ./build/bin/sparlab_topopt \
            --config configs/benchmarks/l_bracket_stress.json \
            --output results/l_bracket_stress \
            --nx 32 --ny 32 --max-iterations 40
          ./build/bin/sparlab_topopt \
            --config configs/benchmarks/l_bracket_stress.json \
            --output results/l_bracket_unconstrained \
            --nx 32 --ny 32 --max-iterations 40 --no-stress
          ./build/bin/sparlab_topopt \
            --config configs/benchmarks/bracket_3d.json \
            --output results/bracket_3d \
            --nx 16 --ny 8 --nz 4 --max-iterations 20 --modes 4

      - name: Heaviside projection, multigrid and real geometry (reduced)
        # The projection with beta continuation (plane MBB beam with and
        # without it; the solid bracket deck, which also selects the
        # multigrid solver), and the two parts whose meshes are read from
        # files. File meshes cannot be coarsened from the command line, so
        # those run at full resolution with a short iteration budget.
        run: |
          ./build/bin/sparlab_topopt --config configs/benchmarks/mbb_beam.json \
            --output results/mbb_beam --nx 90 --ny 30 --max-iterations 80
          ./build/bin/sparlab_topopt --config configs/benchmarks/mbb_beam_projected.json \
            --output results/mbb_beam_projected --nx 90 --ny 30 --max-iterations 80
          ./build/bin/sparlab_topopt --config configs/benchmarks/bracket_3d_projected.json \
            --output results/bracket_3d_projected \
            --nx 16 --ny 8 --nz 4 --max-iterations 30 --modes 3
          ./build/bin/sparlab_topopt --config configs/benchmarks/lug_bracket_2d.json \
            --output results/lug_bracket_2d --max-iterations 40 --modes 3
          ./build/bin/sparlab_topopt --config configs/benchmarks/engine_mount_3d.json \
            --output results/engine_mount_3d --max-iterations 8 --modes 2

      - name: Buckling constraint, robust formulation and overhang filter (reduced)
        # Each deck and the comparison runs scripts/run_all_benchmarks.sh makes
        # of it, at a fraction of the resolution and a short budget: the
        # buckling constraint with the robust projection and the buckling
        # check of the exported part, OC with the robust formulation and the
        # erosion check, and MMA with the overhang filter in 2-D and 3-D.
        run: |
          T=./build/bin/sparlab_topopt
          C=configs/benchmarks
          $T --config $C/column_buckling.json --output results/column_buckling \
             --nx 20 --ny 40 --max-iterations 30
          $T --config $C/column_buckling.json --output results/column_buckling_nonrobust \
             --nx 20 --ny 40 --max-iterations 30 --no-robust --tag nonrobust
          $T --config $C/column_buckling.json --output results/column_buckling_unconstrained \
             --nx 20 --ny 40 --max-iterations 30 --no-buckling-constraint --tag unconstrained
          $T --config $C/mbb_beam_robust.json --output results/mbb_beam_robust \
             --nx 90 --ny 30 --max-iterations 60
          $T --config $C/mbb_beam_robust.json --output results/mbb_beam_robust_off \
             --nx 90 --ny 30 --max-iterations 60 --no-robust --tag robust_off
          $T --config $C/mbb_beam_overhang.json --output results/mbb_beam_overhang \
             --nx 90 --ny 30 --max-iterations 60
          $T --config $C/mbb_beam_overhang.json --output results/mbb_beam_overhang_off \
             --nx 90 --ny 30 --max-iterations 60 --no-overhang-filter --tag overhang_off
          $T --config $C/mbb_beam_overhang.json --output results/mbb_beam_overhang_down \
             --nx 90 --ny 30 --max-iterations 60 --overhang -y --tag build_down
          $T --config $C/bracket_3d_overhang.json --output results/bracket_3d_overhang \
             --nx 16 --ny 8 --nz 4 --max-iterations 30
          $T --config $C/bracket_3d_overhang.json --output results/bracket_3d_overhang_off \
             --nx 16 --ny 8 --nz 4 --max-iterations 30 --no-overhang-filter --tag overhang_off

      - name: Runtime scaling (small sizes, direct and multigrid)
        run: |
          B=./build/bin/sparlab_bench
          $B --sizes 20,40,80 --repeats 1 --output results/benchmark
          $B --sizes 20,40,80 --repeats 1 --solver amg_cg --output results/benchmark
          $B --dim 3 --sizes 8,16 --repeats 1 --output results/benchmark
          $B --dim 3 --sizes 8,16,24 --repeats 1 --solver amg_cg --output results/benchmark
          $B --dim 3 --sizes 8,16 --repeats 1 --solver conjugate_gradient --no-objective \
             --output results/benchmark
          $B --dim 3 --element tet --sizes 8,16 --repeats 1 --output results/benchmark
          $B --dim 3 --element tet --sizes 8,16,24 --repeats 1 --solver amg_cg \
             --output results/benchmark

      - name: Regenerate figures and tables
        run: |
          for case in cantilever_analysis block_3d_analysis cantilever_beam \
                      l_bracket_stress bracket_3d lug_bracket_2d engine_mount_3d; do
            python3 python/scripts/plot_case.py --case results/$case \
                                                --figures ci-figures --no-animation
          done
          for case in mbb_beam_projected bracket_3d_projected column_buckling \
                      mbb_beam_robust mbb_beam_overhang bracket_3d_overhang; do
            python3 python/scripts/plot_case.py --case results/$case \
                                                --figures ci-figures --minimal
          done
          python3 python/scripts/plot_manufacturing.py --results results --figures ci-figures
          python3 python/scripts/plot_comparison.py \
              --constrained results/l_bracket_stress \
              --unconstrained results/l_bracket_unconstrained --figures ci-figures
          python3 python/scripts/plot_projection.py --results results --figures ci-figures
          python3 python/scripts/plot_verification.py \
              --verification results/verification --benchmark results/benchmark \
              --cross-validation results/cross_validation \
              --tet10-study results/tet10_part_study \
              --figures ci-figures || true
          python3 python/scripts/write_result_tables.py --results results \
                                                        --output ci-figures/tables

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-figures
          path: ci-figures/

  python:
    name: precomp (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject.toml allows. torch is not installed:
        # the neural-model tests skip without it (pytest.importorskip), which
        # keeps the job light and checks that they skip cleanly.
        python: ["3.10"]
    env:
      # The tests cap their own threads at two; the solver runs on one.
      OMP_NUM_THREADS: "2"
      PRECOMP_SPARLAB_FORM: ${{ github.workspace }}/build/bin/sparlab_form
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libeigen3-dev libsuitesparse-dev

      - name: Build sparlab_form
        # Only the forming executable the integration tests drive; the C++
        # tests run in build-and-test.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DSPARLAB_BUILD_TESTS=OFF
          cmake --build build --target sparlab_form -j "$(nproc)"
          "$PRECOMP_SPARLAB_FORM" --version

      - name: Install precomp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -c "import precomp, precomp.ml"

      - name: Test
        # -rs lists every skip with its reason. The integration tests with the
        # real sparlab_form skip when the executable is missing; here it was
        # just built, so such a skip is a failure of the job.
        run: |
          set -o pipefail
          python -m pytest python/tests -q -rs 2>&1 | tee pytest.log
          if grep -q "is not built" pytest.log; then
            echo "::error::the sparlab_form integration tests were skipped"
            exit 1
          fi
